<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fly-Half — Rugby Manager</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Fly-Half <span class="sub">rugby match engine</span></h1>
        <div class="controls">
          <label>
            Format
            <select id="format">
              <option value="union">Union (15s)</option>
              <option value="sevens">Sevens (7s)</option>
            </select>
          </label>
          <label>
            Speed
            <select id="speed">
              <option value="1">1×</option>
              <option value="2" selected>2×</option>
              <option value="4">4×</option>
              <option value="8">8×</option>
            </select>
          </label>
          <button id="tacticsBtn">Tactics</button>
          <button id="playPause">Play</button>
          <button id="newMatch">New match</button>
        </div>
      </header>

      <div class="scoreboard">
        <div class="team home">
          <span class="name" id="homeName">Home</span>
          <span class="score" id="homeScore">0</span>
        </div>
        <div class="clock">
          <span id="clock">00:00</span>
          <span class="half" id="half">1st half</span>
        </div>
        <div class="team away">
          <span class="score" id="awayScore">0</span>
          <span class="name" id="awayName">Away</span>
        </div>
      </div>

      <main class="stage">
        <canvas id="pitch"></canvas>
        <aside class="feed">
          <h2>Commentary</h2>
          <ul id="events"></ul>
        </aside>
      </main>
    </div>

    <div id="tacticsDrawer" class="drawer hidden">
      <div class="drawer-panel">
        <div class="drawer-head">
          <h2>Tactics — <span id="tacticsTeam">Your club</span></h2>
          <button id="tacticsClose" aria-label="Close">×</button>
        </div>
        <p class="drawer-hint">
          Set up your attack &amp; defence. Changes apply live, from the next phase.
          The opposition's coach sets up their own way.
        </p>
        <div class="tac-row">
          <label for="presetSel">Preset</label>
          <select id="presetSel"></select>
        </div>
        <div class="tac-group">
          <h3>Attack — formation</h3>
          <div id="formationBtns" class="btnrow"></div>
          <p id="formationBlurb" class="blurb"></p>
        </div>
        <div class="tac-group">
          <h3>Defence — system</h3>
          <div id="systemBtns" class="btnrow"></div>
          <p id="systemBlurb" class="blurb"></p>
        </div>
        <div class="tac-group">
          <h3>Instructions</h3>
          <div id="sliders"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
